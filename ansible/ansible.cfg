[defaults]
# Must point at the specific inventory file, not the whole directory --
# pointing at the directory makes Ansible's yaml inventory plugin scan
# EVERY .yml file under it (except group_vars/host_vars, which are
# special-cased) as a potential inventory SOURCE, not just a vars file.
# Confirmed live 2026-08-04: inventory/examples/user_inputs.example.yml's
# top-level `inventory_hosts:` key got loosely parsed as a bogus inventory
# group, shadowing the real group_vars-sourced `inventory_hosts` dict used
# in `ansible_host: "{{ inventory_hosts.pi_fw }}"` templates -- the
# unresolved literal Jinja string then got used as the host address,
# silently falling back to a LOCAL connection instead of failing loudly.
# group_vars/host_vars auto-discovery still works fine pointed at a single
# file within this directory, same as pointing at the directory itself.
inventory = inventory/hosts.yml
vault_password_file = ~/.local/ansible/pi-homelab-vault-pass
remote_user = admin
deprecation_warnings = false
host_key_checking = false
