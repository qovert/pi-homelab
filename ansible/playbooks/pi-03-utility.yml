---
- name: Deploy utility services on pi-03
  hosts: utility
  become: true

  handlers:
    - name: restart kavita
      ansible.builtin.systemd:
        name: kavita.service
        state: restarted
        daemon_reload: true

    - name: restart uptime-kuma
      ansible.builtin.systemd:
        name: uptime-kuma.service
        state: restarted
        daemon_reload: true

    - name: restart homepage
      ansible.builtin.systemd:
        name: homepage.service
        state: restarted
        daemon_reload: true

    - name: restart alloy
      ansible.builtin.systemd:
        name: alloy.service
        state: restarted
        daemon_reload: true

    - name: restart heartbeat
      ansible.builtin.systemd:
        name: heartbeat.service
        state: restarted
        daemon_reload: true


  tasks:
    # --- Kavita ---
    - name: Deploy Kavita container unit
      ansible.builtin.template:
        src: ../templates/kavita/kavita.container.j2
        dest: /etc/containers/systemd/kavita.container
        owner: root
        group: root
        mode: "0644"
      notify: restart kavita

    - name: Create Kavita library directory on NFS
      ansible.builtin.file:
        path: "{{ storage.data_dir }}/kavita/library"
        state: directory
        owner: "{{ ansible_access.admin_user }}"
        group: "{{ ansible_access.admin_user }}"
        mode: "0750"
      become_user: "{{ ansible_access.admin_user }}"

    # SQLite on NFS is unreliable — config (db) lives on local disk
    - name: Create Kavita config directory (local)
      ansible.builtin.file:
        path: /opt/kavita/config
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Enable and start Kavita
      ansible.builtin.systemd:
        name: kavita.service
        state: started
        enabled: true
        daemon_reload: true

    # --- Uptime Kuma ---
    - name: Deploy Uptime Kuma container unit
      ansible.builtin.template:
        src: ../templates/uptime-kuma/uptime-kuma.container.j2
        dest: /etc/containers/systemd/uptime-kuma.container
        owner: root
        group: root
        mode: "0644"
      notify: restart uptime-kuma

    # SQLite on NFS is unreliable — data lives on local disk.
    # Uptime Kuma runs as node (UID 1000) inside the container.
    - name: Create Uptime Kuma data directory (local)
      ansible.builtin.file:
        path: /opt/uptime-kuma/data
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0750"

    - name: Enable and start Uptime Kuma
      ansible.builtin.systemd:
        name: uptime-kuma.service
        state: started
        enabled: true
        daemon_reload: true

    # --- Homepage ---
    - name: Deploy Homepage container unit
      ansible.builtin.template:
        src: ../templates/homepage/homepage.container.j2
        dest: /etc/containers/systemd/homepage.container
        owner: root
        group: root
        mode: "0644"
      notify: restart homepage

    - name: Create Homepage config directory
      ansible.builtin.file:
        path: "{{ storage.data_dir }}/homepage"
        state: directory
        owner: "{{ ansible_access.admin_user }}"
        group: "{{ ansible_access.admin_user }}"
        mode: "0750"
      become_user: "{{ ansible_access.admin_user }}"

    - name: Deploy Homepage config files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ ansible_access.admin_user }}"
        group: "{{ ansible_access.admin_user }}"
        mode: "0644"
      become_user: "{{ ansible_access.admin_user }}"
      loop:
        - src: ../templates/homepage/services.yaml.j2
          dest: "{{ storage.data_dir }}/homepage/services.yaml"
        - src: ../templates/homepage/settings.yaml.j2
          dest: "{{ storage.data_dir }}/homepage/settings.yaml"
      notify: restart homepage

    - name: Enable and start Homepage
      ansible.builtin.systemd:
        name: homepage.service
        state: started
        enabled: true
        daemon_reload: true

    # --- Alloy (log shipping to pi-fw aggregator) ---
    - name: Enable podman.socket
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true

    - name: Create Alloy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - /etc/alloy
        - /var/lib/alloy/data

    - name: Deploy Alloy config
      ansible.builtin.template:
        src: ../templates/alloy/config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        mode: "0644"
      notify: restart alloy

    - name: Deploy Alloy container unit
      ansible.builtin.template:
        src: ../templates/alloy/alloy.container.j2
        dest: /etc/containers/systemd/alloy.container
        owner: root
        group: root
        mode: "0644"
      notify: restart alloy

    - name: Enable and start Alloy
      ansible.builtin.systemd:
        name: alloy.service
        state: started
        enabled: true
        daemon_reload: true

    - name: Deploy heartbeat container unit
      ansible.builtin.template:
        src: ../templates/alloy/heartbeat.container.j2
        dest: /etc/containers/systemd/heartbeat.container
        owner: root
        group: root
        mode: "0644"
      notify: restart heartbeat

    - name: Enable and start heartbeat
      ansible.builtin.systemd:
        name: heartbeat.service
        state: started
        enabled: true
        daemon_reload: true

