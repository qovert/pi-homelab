---
- name: Deploy blog content
  hosts: utility
  become: false

  tasks:
    - name: Sync blog source from repo
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../blog/"
        dest: /opt/blog/source/
        delete: true
        recursive: true

    - name: Trigger blog build
      ansible.builtin.systemd:
        name: blog-build.service
        state: started
      become: true
