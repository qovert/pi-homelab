        src: ../templates/restic/backup.sh.j2
        dest: /usr/local/bin/restic-backup
        owner: root
        group: root
        mode: "0750"
      no_log: true

    - name: Deploy restic systemd units
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - src: ../templates/restic/restic-backup.service.j2
          dest: /etc/systemd/system/restic-backup.service
        - src: ../templates/restic/restic-backup.timer.j2
          dest: /etc/systemd/system/restic-backup.timer
        - src: ../templates/restic/restic-check.service.j2
          dest: /etc/systemd/system/restic-check.service
        - src: ../templates/restic/restic-check.timer.j2
          dest: /etc/systemd/system/restic-check.timer
      notify: reload systemd

    - name: Enable restic timers
      ansible.builtin.systemd:
