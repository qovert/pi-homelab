- name: Configure node display
  hosts: all:!switch:!fw
  become: true

  handlers:
    - name: restart node-display
      ansible.builtin.systemd:
        name: node-display.service
        state: restarted
        daemon_reload: true

  tasks:
    - name: Skip nodes without a display configured
      ansible.builtin.meta: end_host
      when: display is not defined

    - name: Enable I2C in boot config
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: '^#?dtparam=i2c_arm'
        line: dtparam=i2c_arm=on
      register: _i2c_config

    - name: Enable i2c-dev module on boot
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: i2c-dev
        create: true

    - name: Reboot to activate I2C
      ansible.builtin.reboot:
        reboot_timeout: 120
      when: _i2c_config.changed

    - name: Install display dependencies
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-psutil
          - python3-pil
          - i2c-tools
        state: present
        update_cache: false

    - name: Install display Python library
      ansible.builtin.pip:
        name: "{{ 'luma.oled' if display.type == 'ssd1306' else 'RPLCD[smbus2]' }}"
        extra_args: --break-system-packages
        executable: pip3

    - name: Deploy display script
      ansible.builtin.template:
        src: "../templates/display/{{ display.type }}.py.j2"
        dest: /usr/local/bin/node-display
        owner: root
        group: root
        mode: "0755"
      notify: restart node-display

    - name: Deploy display systemd service
      ansible.builtin.template:
        src: ../templates/display/display.service.j2
        dest: /etc/systemd/system/node-display.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start display service
      ansible.builtin.systemd:
        name: node-display.service
        state: started
        enabled: true
        daemon_reload: true
