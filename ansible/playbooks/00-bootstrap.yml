      loop: "{{ compose_projects }}"

    - name: Create /etc/restic directory
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Deploy restic env file
      ansible.builtin.template:
        src: ../templates/restic/restic.env.j2
        dest: /etc/restic/env
        owner: root
        group: root
        mode: "0600"
