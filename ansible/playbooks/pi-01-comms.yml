---
- name: Deploy comms services on pi-01
  hosts: comms
  become: true

  handlers:
    - name: restart rocketchat
      ansible.builtin.systemd:
        name: rocketchat.service
        state: restarted
        daemon_reload: true

    - name: restart homelabbot
      ansible.builtin.systemd:
        name: homelabbot.service
        state: restarted
        daemon_reload: true

    - name: restart alloy
      ansible.builtin.systemd:
        name: alloy.service
        state: restarted
        daemon_reload: true

    - name: restart heartbeat
      ansible.builtin.systemd:
        name: heartbeat.service
        state: restarted
        daemon_reload: true

  tasks:
    # --- Rocket.Chat + MongoDB ---
    - name: Remove old native Mattermost service if present
      ansible.builtin.systemd:
        name: mattermost.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove old Mattermost service file
      ansible.builtin.file:
        path: /etc/systemd/system/mattermost.service
        state: absent

    - name: Create Rocket.Chat data directories
      ansible.builtin.file:
        path: "{{ storage.data_dir }}/rocketchat/{{ item }}"
        state: directory
        owner: "{{ ansible_access.admin_user }}"
        group: "{{ ansible_access.admin_user }}"
        mode: "0750"
      loop:
        - mongodb
        - mongo-init
        - backups

    - name: Deploy MongoDB replica set init script
      ansible.builtin.copy:
        dest: "{{ storage.data_dir }}/rocketchat/mongo-init/replica-set-init.js"
        owner: "{{ ansible_access.admin_user }}"
        group: "{{ ansible_access.admin_user }}"
        mode: "0644"
        content: |
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'rocketchat-mongo:27017' }] });

    - name: Deploy Rocket.Chat network unit
      ansible.builtin.template:
        src: ../templates/rocketchat/rocketchat-net.network.j2
        dest: /etc/containers/systemd/rocketchat-net.network
        owner: root
        group: root
        mode: "0644"
      notify: restart rocketchat

    - name: Deploy MongoDB container unit
      ansible.builtin.template:
        src: ../templates/rocketchat/mongo.container.j2
        dest: /etc/containers/systemd/rocketchat-mongo.container
        owner: root
        group: root
        mode: "0644"
      notify: restart rocketchat

    - name: Create /opt/rocketchat directory
      ansible.builtin.file:
        path: /opt/rocketchat
        state: directory
        owner: "{{ ansible_access.admin_user }}"
        group: "{{ ansible_access.admin_user }}"
        mode: "0750"

    - name: Deploy Rocket.Chat environment file
      ansible.builtin.template:
        src: ../templates/rocketchat/rocketchat.env.j2
        dest: /opt/rocketchat/rocketchat.env
        owner: "{{ ansible_access.admin_user }}"
        group: "{{ ansible_access.admin_user }}"
        mode: "0600"
      no_log: true
      notify: restart rocketchat

    - name: Deploy Rocket.Chat container unit
      ansible.builtin.template:
        src: ../templates/rocketchat/rocketchat.container.j2
        dest: /etc/containers/systemd/rocketchat.container
        owner: root
        group: root
        mode: "0644"
      notify: restart rocketchat

    - name: Enable and start Rocket.Chat
      ansible.builtin.systemd:
        name: rocketchat.service
        state: started
        enabled: true
        daemon_reload: true

    # --- HomelabBot ---
    - name: Deploy HomelabBot container unit
      ansible.builtin.template:
        src: ../templates/homelabbot/homelabbot.container.j2
        dest: /etc/containers/systemd/homelabbot.container
        owner: root
        group: root
        mode: "0644"
      notify: restart homelabbot

    - name: Deploy HomelabBot env file
      ansible.builtin.template:
        src: ../templates/homelabbot/env.j2
        dest: /opt/homelabbot/.env
        owner: "{{ ansible_access.admin_user }}"
        group: "{{ ansible_access.admin_user }}"
        mode: "0600"
      no_log: true
      notify: restart homelabbot

    - name: Enable HomelabBot (image must be built locally before it will start)
      ansible.builtin.systemd:
        name: homelabbot.service
        enabled: true
        daemon_reload: true

    # --- Alloy (log shipping to pi-fw aggregator) ---
    - name: Enable podman.socket
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true

    - name: Create Alloy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - /etc/alloy
        - /var/lib/alloy/data

    - name: Deploy Alloy config
      ansible.builtin.template:
        src: ../templates/alloy/config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        mode: "0644"
      notify: restart alloy

    - name: Deploy Alloy container unit
      ansible.builtin.template:
        src: ../templates/alloy/alloy.container.j2
        dest: /etc/containers/systemd/alloy.container
        owner: root
        group: root
        mode: "0644"
      notify: restart alloy

    - name: Enable and start Alloy
      ansible.builtin.systemd:
        name: alloy.service
        state: started
        enabled: true
        daemon_reload: true

    - name: Deploy heartbeat container unit
      ansible.builtin.template:
        src: ../templates/alloy/heartbeat.container.j2
        dest: /etc/containers/systemd/heartbeat.container
        owner: root
        group: root
        mode: "0644"
      notify: restart heartbeat

    - name: Enable and start heartbeat
      ansible.builtin.systemd:
        name: heartbeat.service
        state: started
        enabled: true
        daemon_reload: true
