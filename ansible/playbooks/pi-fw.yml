---
- name: Configure pi-fw (router, firewall, tunnel)
  hosts: fw
  become: true

  vars:
    # Pinned so a fresh run doesn't silently pick up a new Alloy release --
    # bump both together when upgrading (checksum from the release's
    # SHA256SUMS asset).
    alloy_version: "1.18.0"
    alloy_arm64_sha256: "e20f8570628818a15192d34372839017a4c446269b5d96036ad976ebf7a7728a"

  pre_tasks:
    - name: Verify interface names are set
      ansible.builtin.assert:
        that:
          - pi_fw_wan_iface is not search('CHANGE_ME')
          - pi_fw_lan_iface is not search('CHANGE_ME')
        fail_msg: Set pi_fw_wan_iface and pi_fw_lan_iface in host_vars/pi-fw.yml before running this playbook.

    - name: Verify Cloudflare tunnel token is set
      ansible.builtin.assert:
        that:
          - vault.cloudflare.tunnel_token is not search('CHANGE_ME')
        fail_msg: Fill vault.cloudflare.tunnel_token in vault.yml before running this playbook.

    - name: Verify IVPN private key is set
      ansible.builtin.assert:
        that:
          - vault.ivpn.private_key is not search('CHANGE_ME')
        fail_msg: Fill vault.ivpn.private_key in vault.yml before running this playbook.

  tasks:
    # Rocket.Chat webhook is supplementary alerting, not core VPN function --
    # warn rather than hard-fail, since creating it requires a manual
    # one-time step in Rocket.Chat's admin UI (see runbook.md).
    - name: Warn if Rocket.Chat webhook for IVPN monitoring is not configured
      ansible.builtin.debug:
        msg: >-
          vault.monitoring.rocketchat_webhook_path is still CHANGE_ME --
          ivpn-monitor will run but killswitch alerts won't actually be
          delivered until this is set.
      when: vault.monitoring.rocketchat_webhook_path is search('CHANGE_ME')

    # chimaera's tailnet IP isn't known until it actually joins the tailnet
    # (a separate, manual, one-time bootstrap on that host) -- Alloy will
    # still run and accept pushes from pi-01..04 with the placeholder in
    # place, it just can't forward them on yet.
    - name: Warn if chimaera's Tailscale IP is not yet configured
      ansible.builtin.debug:
        msg: >-
          services.log_aggregation.chimaera_tailscale_ip is still
          CHANGE_ME -- the log aggregator will accept pushes from pi-nodes
          but can't forward them to chimaera's Loki until this is set.
      when: services.log_aggregation.chimaera_tailscale_ip is search('CHANGE_ME')

    - name: Configure WAN interface to ignore upstream DNS
      community.general.nmcli:
        conn_name: "{{ pi_fw_wan_iface }}"
        ifname: "{{ pi_fw_wan_iface }}"
        type: ethernet
        dns4_ignore_auto: true
        method4: auto
        method6: disabled
        autoconnect: true
        state: present
      notify: nmcli up wan

    - name: Configure LAN interface with static IP
      community.general.nmcli:
        conn_name: "{{ pi_fw_lan_iface }}-lan"
        ifname: "{{ pi_fw_lan_iface }}"
        type: ethernet
        ip4: "{{ networking.gateway }}/24"
        dns4:
          - 127.0.0.1
        dns4_ignore_auto: true
        method4: manual
        method6: disabled
        autoconnect: true
        state: present
      notify: nmcli up lan

    - name: Disable Tailscale DNS management on pi-fw
      ansible.builtin.command:
        cmd: tailscale set --accept-dns=false
      register: tailscale_dns
      changed_when: false

    - name: Enable IP forwarding
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        # Default sysctl_file is /etc/sysctl.conf -- current systemd-sysctl
        # no longer applies that legacy path at boot (confirmed live on
        # pi-fw 2026-07-27: value was correctly in /etc/sysctl.conf but
        # read back as 0 after a reboot), silently breaking all LAN subnet
        # routing until the next manual `sysctl --system`. Write to a real
        # sysctl.d file instead so it actually persists across reboots.
        sysctl_file: /etc/sysctl.d/99-ip-forward.conf
        sysctl_set: true
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    - name: Install WireGuard
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true

    - name: Deploy wg-ivpn WireGuard config
      ansible.builtin.template:
        src: ../templates/pi-fw/wg-ivpn.conf.j2
        dest: /etc/wireguard/wg-ivpn.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: restart wg-quick

    - name: Create wg-quick@wg-ivpn systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/wg-quick@wg-ivpn.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy wg-quick@wg-ivpn systemd override
      ansible.builtin.template:
        src: ../templates/pi-fw/wg-quick-wg-ivpn-override.conf.j2
        dest: /etc/systemd/system/wg-quick@wg-ivpn.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart wg-quick

    - name: Enable and start wg-quick@wg-ivpn
      ansible.builtin.systemd:
        name: wg-quick@wg-ivpn
        state: started
        enabled: true
        daemon_reload: true

    # Deploy the tunnel before the nftables cutover below (which restricts
    # LAN forwarding to oifname wg-ivpn only) to minimize the live-outage
    # window on first apply.
    - name: Install nftables and dnsmasq
      ansible.builtin.apt:
        name:
          - nftables
          - dnsmasq
        state: present
        update_cache: true

    - name: Deploy nftables ruleset
      ansible.builtin.template:
        src: ../templates/pi-fw/nftables.conf.j2
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0640"
      notify: reload nftables

    - name: Enable and start nftables
      ansible.builtin.systemd:
        name: nftables
        state: started
        enabled: true

    - name: Deploy dnsmasq config
      ansible.builtin.template:
        src: ../templates/pi-fw/dnsmasq.conf.j2
        dest: /etc/dnsmasq.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart dnsmasq

    - name: Create dnsmasq systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/dnsmasq.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy dnsmasq systemd drop-in for network ordering
      ansible.builtin.copy:
        dest: /etc/systemd/system/dnsmasq.service.d/wait-for-network.conf
        content: |
          [Unit]
          After=network-online.target tailscaled.service wg-quick@wg-ivpn.service
          Wants=network-online.target tailscaled.service wg-quick@wg-ivpn.service
        owner: root
        group: root
        mode: "0644"
      notify: restart dnsmasq

    - name: Enable NetworkManager-wait-online
      ansible.builtin.systemd:
        name: NetworkManager-wait-online.service
        enabled: true

    - name: Enable and start dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: started
        enabled: true
        daemon_reload: true

    - name: Install Tailscale
      ansible.builtin.shell: |
        curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Enable Tailscale service
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true

    - name: Advertise LAN subnet via Tailscale
      ansible.builtin.command:
        cmd: tailscale set --advertise-routes=10.42.0.0/24
      changed_when: false

    - name: Install cloudflared
      ansible.builtin.apt:
        deb: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64.deb
        state: present

    - name: Create cloudflared config directory
      ansible.builtin.file:
        path: /etc/cloudflared
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Deploy cloudflared config
      ansible.builtin.template:
        src: ../templates/pi-fw/cloudflared-config.yml.j2
        dest: /etc/cloudflared/config.yml
        owner: root
        group: root
        mode: "0640"
      notify: restart cloudflared

    - name: Deploy cloudflared token env file
      ansible.builtin.template:
        src: ../templates/pi-fw/cloudflared.env.j2
        dest: /etc/cloudflared/cloudflared.env
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: restart cloudflared

    - name: Deploy cloudflared systemd service
      ansible.builtin.template:
        src: ../templates/pi-fw/cloudflared.service.j2
        dest: /etc/systemd/system/cloudflared.service
        owner: root
        group: root
        mode: "0640"
      notify: restart cloudflared

    - name: Enable and start cloudflared
      ansible.builtin.systemd:
        name: cloudflared
        state: started
        enabled: true
        daemon_reload: true

    - name: Deploy ivpn-monitor script
      ansible.builtin.template:
        src: ../templates/pi-fw/ivpn-monitor.sh.j2
        dest: /usr/local/bin/ivpn-monitor
        owner: root
        group: root
        mode: "0750"

    - name: Deploy ivpn-monitor env file
      ansible.builtin.template:
        src: ../templates/pi-fw/ivpn-monitor.env.j2
        dest: /etc/ivpn-monitor.env
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Deploy ivpn-monitor systemd service
      ansible.builtin.template:
        src: ../templates/pi-fw/ivpn-monitor.service.j2
        dest: /etc/systemd/system/ivpn-monitor.service
        owner: root
        group: root
        mode: "0644"

    - name: Deploy ivpn-monitor systemd timer
      ansible.builtin.template:
        src: ../templates/pi-fw/ivpn-monitor.timer.j2
        dest: /etc/systemd/system/ivpn-monitor.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start ivpn-monitor timer
      ansible.builtin.systemd:
        name: ivpn-monitor.timer
        state: started
        enabled: true
        daemon_reload: true

    # Log aggregator: receives pushes from pi-01..04 over the LAN, forwards
    # to chimaera's Loki over Tailscale. pi-fw has no Podman of its own, so
    # this is a static binary + systemd unit like ivpn-monitor/cloudflared,
    # not a container.
    - name: Create Alloy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - /etc/alloy
        - /var/lib/alloy/data

    - name: Download and verify Alloy binary
      ansible.builtin.get_url:
        url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-linux-arm64.zip"
        dest: /tmp/alloy-linux-arm64.zip
        checksum: "sha256:{{ alloy_arm64_sha256 }}"
        mode: "0644"

    - name: Extract Alloy binary
      ansible.builtin.unarchive:
        src: /tmp/alloy-linux-arm64.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/alloy-linux-arm64

    - name: Install Alloy binary
      ansible.builtin.copy:
        src: /tmp/alloy-linux-arm64
        dest: /usr/local/bin/alloy
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: restart alloy

    - name: Deploy Alloy config
      ansible.builtin.template:
        src: ../templates/pi-fw/alloy-config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        mode: "0644"
      notify: restart alloy

    - name: Deploy Alloy systemd unit
      ansible.builtin.template:
        src: ../templates/pi-fw/alloy.service.j2
        dest: /etc/systemd/system/alloy.service
        owner: root
        group: root
        mode: "0644"
      notify: restart alloy

    - name: Enable and start Alloy
      ansible.builtin.systemd:
        name: alloy
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: nmcli up wan
      ansible.builtin.command:
        cmd: nmcli connection up {{ pi_fw_wan_iface }}
      changed_when: true

    - name: nmcli up lan
      ansible.builtin.command:
        cmd: nmcli connection up {{ pi_fw_lan_iface }}-lan
      changed_when: true

    - name: reload nftables
      ansible.builtin.systemd:
        name: nftables
        state: reloaded

    - name: restart dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted

    - name: restart cloudflared
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted

    - name: restart wg-quick
      ansible.builtin.systemd:
        name: wg-quick@wg-ivpn
        state: restarted
        daemon_reload: true

    - name: restart alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted
        daemon_reload: true
