lab:
  domain: CHANGE_ME_DOMAIN              # e.g. bitrot.me — all FQDNs below derive from this
  admin_email: "admin@{{ lab.domain }}"
  ssh_public_key: CHANGE_ME_SSH_PUBLIC_KEY

ansible_access:
  admin_user: admin
  admin_port: 22
  bootstrap_user: admin
  bootstrap_port: 22

inventory_hosts:
  pi_fw:       10.42.0.1
  pi_01:       10.42.0.11
  pi_02:       10.42.0.12
  pi_03:       10.42.0.13
  pi_04:       10.42.0.14
  pi_nas:      10.42.0.20
  pi4_01:      10.42.0.21
  pi4_02:      10.42.0.22
  mikrotik_sw: 10.42.0.2

networking:
  lab_cidr: 10.42.0.0/24
  gateway: 10.42.0.1
  dhcp_range_start: 10.42.0.100
  dhcp_range_end: 10.42.0.200


storage:
  data_dir: /data
  restic_b2_bucket: pi-homelab           # single B2 bucket; repos are path-prefixed per node

cloudflare:
  tunnel_name: pi-homelab
  account_id: CHANGE_ME_CF_ACCOUNT_ID

services:
  nextcloud:
    fqdn: "cloud.{{ lab.domain }}"
  rocketchat:
    fqdn: "chat.{{ lab.domain }}"
  # Identity (Authelia OIDC portal + LLDAP directory) on pi-04
  authelia:
    fqdn: "auth.{{ lab.domain }}"
  ldap:
    base_dn: dc=CHANGE_ME,dc=CHANGE_ME   # e.g. dc=bitrot,dc=me — must match domain split manually
  # Outbound SMTP relay for app notifications (authenticated SMTP submission)
  mail:
    notifier: smtp                # Authelia notifier: smtp | filesystem (filesystem = no mail dependency)
    relay_host: CHANGE_ME_SMTP_HOST   # SMTP submission host (e.g. your mail server)
    relay_port: 465
    relay_security: ssl           # implicit TLS on 465 (use "starttls" for 587)
    sender_domain: "{{ lab.domain }}"
  miniflux:
    fqdn: "rss.{{ lab.domain }}"
  kavita:
    fqdn: "books.{{ lab.domain }}"
  uptime_kuma:
    fqdn: "status.{{ lab.domain }}"
  vaultwarden:
    fqdn: "vault.{{ lab.domain }}"
  # Split-tunnel VPN egress for LAN clients on pi-fw (optional). Generate a
  # WireGuard config from your VPN provider, pick one server/endpoint, and
  # fill in its Peer section + DNS resolver here. Private key + tunnel
  # address are secrets (vault.ivpn) -- see vault.example.yml.
  ivpn:
    server: CHANGE_ME_IVPN_SERVER          # e.g. us-ash-us-va1
    peer_public_key: CHANGE_ME_IVPN_PEER_PUBLIC_KEY
    endpoint: CHANGE_ME_IVPN_ENDPOINT      # host:port
    dns: CHANGE_ME_IVPN_DNS
    fwmark: "0x1"
    table: 200
  homelabbot:
    rocketchat_url: "https://{{ services.rocketchat.fqdn }}"
    channel_name: general
